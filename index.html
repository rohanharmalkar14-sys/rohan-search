<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohan Search</title>
<style>
body{font-family:Arial,sans-serif;text-align:center;background:#fff;margin:0;padding:0}
main{margin:140px auto 0;padding:20px;max-width:600px}
h1{font-size:48px;color:#4285f4;margin-bottom:35px}
h1 span{color:#ea4335}
input{width:90%;padding:16px;border:1px solid #ddd;border-radius:30px;font-size:18px;box-sizing:border-box}
button{margin-top:22px;padding:13px 30px;border:0;border-radius:25px;background:#4285f4;color:white;font-size:17px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Rohan <span>Search</span></h1>
<form action="https://www.google.com/search" method="GET">
<input type="search" name="q" placeholder="Search the internet..." required>
<br>
<button type="submit">Search</button>
</form>
<p>Search the world with Rohan Search</p>
</main>
</body>
</html>
